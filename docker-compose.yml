services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: assistant
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d assistant"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/assistant
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

  # Refresh content from the public website:  docker compose run --rm crawler
  crawler:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/assistant
    command: ["python", "-m", "app.crawl"]
    depends_on:
      db:
        condition: service_healthy
    profiles: ["crawl"]

volumes:
  pgdata:
