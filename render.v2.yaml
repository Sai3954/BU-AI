# v2 PREVIEW (separate from the live demo). In Render: New > Blueprint > this repository,
# Branch: v2, Blueprint Path: render.v2.yaml. bu-ai-v2-api on Standard (1 CPU, 2 GB), bu-ai-v2-web on Starter.
# No separate database: SQLite on a 1 GB persistent disk at /data, so question logs, ratings and handoff
# counts survive restarts and deploys. The knowledge base is (re)built from backend/data at start.
services:
  - type: web
    name: bu-ai-v2-api
    runtime: docker
    rootDir: backend
    branch: v2
    plan: standard              # $25/month, demo week; drop to starter afterwards
    healthCheckPath: /api/health
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        value: sqlite:////data/app.db
      - key: CORS_ORIGINS
        value: https://bu-ai-v2-web.onrender.com
      - key: TRUST_PROXY
        value: "true"
      - key: EMBEDDINGS_PROVIDER
        value: local            # semantic search runs on the server itself (no extra key or cost)
      - key: ADMIN_TOKEN
        sync: false             # can be the same strong token as the live site
      - key: LLM_PROVIDER
        value: anthropic
      - key: ANTHROPIC_API_KEY
        sync: false             # paste in the Render dashboard only, never in code or chat
      - key: DAILY_AI_LIMIT
        value: "600"            # raised for the 300-question friends test; lower after
      - key: CHAT_RATE_PER_MINUTE
        value: "12"

  - type: web
    name: bu-ai-v2-web
    runtime: docker
    rootDir: frontend
    branch: v2
    plan: starter               # $7/month: always on, no spin-down
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://bu-ai-v2-api.onrender.com
