# One-click hosting on Render (render.com): New > Blueprint > pick this repository.
# Creates the API, the website and a Postgres database. You will be asked for ADMIN_TOKEN and an AI key.
# Plans below are FREE: services sleep after 15 minutes idle (first visit then takes about a minute)
# and the free database is deleted 30 days after creation.
# Before a university demo, switch to always-on: in the Render dashboard set both services to "Starter"
# ($7/month each) and the database to "Basic-256mb" ($6/month), or change "free" below and redeploy.
databases:
  - name: bu-ai-db
    plan: free
    databaseName: buai
    user: buai

services:
  - type: web
    name: bu-ai-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: bu-ai-db, property: connectionString }
      - key: CORS_ORIGINS
        fromService: { type: web, name: bu-ai-web, property: host }
      - key: TRUST_PROXY
        value: "true"
      - key: ADMIN_TOKEN
        sync: false            # paste a strong token: python -c "import secrets; print(secrets.token_urlsafe(24))"
      - key: LLM_PROVIDER
        value: anthropic       # or openai / azure / none
      - key: ANTHROPIC_API_KEY
        sync: false            # paste your key in the Render dashboard, never in code or chat
      - key: OPENAI_API_KEY
        sync: false
      - key: DAILY_AI_LIMIT
        value: "300"           # spending cap: after this many AI answers per day, official-text answers
      - key: CHAT_RATE_PER_MINUTE
        value: "12"

  - type: web
    name: bu-ai-web
    runtime: docker
    rootDir: frontend
    plan: free
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService: { type: web, name: bu-ai-api, property: host }
